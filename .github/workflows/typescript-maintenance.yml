name: typescript-maintenance

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "prompts/**"
      - ".github/workflows/typescript-maintenance.yml"
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "prompts/**"
      - ".github/workflows/typescript-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test legacy TypeScript scaffolding
        run: npm test
