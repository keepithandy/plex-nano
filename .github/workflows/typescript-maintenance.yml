name: typescript-maintenance

on:
  pull_request:
    paths:
      - "scripts/PlexLocal.py"
      - "scripts/plex_phase*_smoke.py"
      - "scripts/plex_phase2_eval.py"
      - "scripts/plex_phase2_infer.py"
      - "scripts/Invoke-PlexPhase2.ps1"
      - "scripts/plex_phase2_eos_probe.py"
      - "scripts/Invoke-PlexPhase2Eos.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "prompts/**"
      - ".github/workflows/typescript-maintenance.yml"
  push:
    branches:
      - master
    paths:
      - "scripts/PlexLocal.py"
      - "scripts/plex_phase*_smoke.py"
      - "scripts/plex_phase2_eval.py"
      - "scripts/plex_phase2_infer.py"
      - "scripts/Invoke-PlexPhase2.ps1"
      - "scripts/plex_phase2_eos_probe.py"
      - "scripts/Invoke-PlexPhase2Eos.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "prompts/**"
      - ".github/workflows/typescript-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test legacy TypeScript scaffolding
        run: npm test
      - name: Smoke-test the installed dashboard
        shell: bash
        run: |
          set -euo pipefail
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)
          install_dir=$(mktemp -d "$RUNNER_TEMP/plex install.XXXXXX")
          npm install --prefix "$install_dir" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$archive"
          cd "$install_dir"
          transcript=$(printf '%s\n' /paste 'let value = 1;' .end 'rename value to count' /clear /status /exit | ./node_modules/.bin/plex)
          test "$(grep -c 'PLEX LOCAL' <<< "$transcript")" -eq 2
          grep -Fq 'let count = 1;' <<< "$transcript"
          grep -Fq 'Edited' <<< "$transcript"
          ./node_modules/.bin/plex --version

  console-editing:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Phase 2 PowerShell launcher does not execute without -Run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/Invoke-PlexPhase2.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Read-only Phase 2 launcher help failed' }
          & ./scripts/Invoke-PlexPhase2Eos.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Read-only EOS launcher help failed' }
      - name: Run Phase 0, Phase 1 and Phase 2 console checks
        run: |
          python -I -S scripts/plex_phase0_smoke.py
          python -I -S scripts/plex_phase1_smoke.py -v
          python -I -S scripts/plex_phase2_eval.py
          python -I -S scripts/plex_phase2_smoke.py -v
          python -I -S scripts/plex_phase2_eos_smoke.py -v
