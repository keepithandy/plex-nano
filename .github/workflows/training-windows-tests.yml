name: training-windows-tests

on:
  pull_request:
    paths:
      - "training/**"
      - ".gitattributes"
      - ".github/workflows/training-windows-tests.yml"
      - ".github/workflows/training-tests.yml"
  push:
    branches:
      - master
    paths:
      - "training/**"
      - ".gitattributes"
      - ".github/workflows/training-windows-tests.yml"
      - ".github/workflows/training-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked training environment
        run: uv sync --project training --frozen --group dev
      - name: Run Windows portability subset
        run: >
          uv run --project training --no-sync python -m pytest
          training/tests/test_data_and_runner.py::DataAndRunnerTests::test_packed_corpus_yields_next_token_pairs
          training/tests/test_pilot.py::PilotSafetyTests::test_checkpoint_serialization_is_bounded_before_overallocation
          training/tests/test_pilot.py::PilotSafetyTests::test_checkpoint_overwrite_budget_counts_old_checkpoint_during_temp_write
          training/tests/test_pilot.py::PilotSafetyTests::test_failed_final_allocation_check_preserves_checkpoint
          training/tests/test_resume_and_completion.py::ArtifactDestinationRegressionTests::test_windows_destination_spelling_rejects_aliases_and_devices
          training/tests/test_resume_and_completion.py::ArtifactDestinationRegressionTests::test_windows_aliases_rejected_before_device_or_checkpoint_work
          training/tests/test_resume_and_completion.py::ArtifactDestinationRegressionTests::test_resolved_windows_destination_is_validated_too
          training/tests/test_resume_and_completion.py::ArtifactDestinationRegressionTests::test_checkpoint_staging_path_cannot_be_metrics_destination
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_identity_is_deterministic
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_second_publish_failure_rolls_back_existing_pair
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_interruptions_restore_both_outputs
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_rejects_fresh_windows_output_aliases_before_input_read
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_review_rejects_windows_report_spellings_before_input_read
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_checks_resolved_windows_output_spelling
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_cli_defaults_are_absolute_and_rooted_at_repository
          training/tests/test_cli.py::CliTests::test_artifact_root_helper_does_not_double_existing_prefix
          training/tests/test_file_edit_replacements_bundle.py::test_bundle_packs_only_train_validation_with_exact_next_token_masks
          training/tests/test_file_edit_replacements_bundle.py::test_bundle_low_storage_budget_rolls_back_before_publication
          training/tests/test_file_edit_replacements_bundle.py::test_p302_cli_commands_use_rooted_paths_and_no_training_switch
          training/tests/test_file_edit_replacements_stage.py::test_stage_rejects_missing_explicit_authorization_without_source_access
          training/tests/test_file_edit_replacements_stage.py::test_validation_baseline_is_masked_and_complete_without_training
          training/tests/test_file_edit_replacements_stage.py::test_cli_exposes_separate_stage_and_baseline_without_training
          training/tests/test_file_edit_replacements_run.py::FileEditReplacementRunTests::test_training_needs_both_flag_and_owner_approved_packet_before_model_reads
          training/tests/test_file_edit_replacements_run.py::FileEditReplacementRunTests::test_cli_preflight_has_no_approval_flag_and_run_is_blocked_by_default
          training/tests/test_file_edit_replacements_run.py::FileEditReplacementRunTests::test_training_step_supervises_only_masked_targets
          training/tests/test_file_edit_replacements_development.py::test_frozen_endpoint_identity_and_exact_declared_gate
          training/tests/test_file_edit_replacements_development.py::test_perfect_development_responses_pass_exactly_predeclared_gate
          training/tests/test_file_edit_replacements_development.py::test_evaluator_rejects_existing_output_before_checkpoint_or_model_read
          training/tests/test_file_edit_replacements_development.py::test_synthetic_end_to_end_read_only_36_responses
          training/tests/test_file_edit_replacements_diagnostic.py::test_read_only_diagnostic_distinguishes_language_and_contrast_diversity
          training/tests/test_p303_diagnostic_decision.py
          training/tests/test_p3_copy_edit_controls.py
          training/tests/test_p3_copy_fidelity_curriculum.py
          training/tests/test_p3_copy_fidelity_bundle_stage.py
          training/tests/test_p3_copy_fidelity_first_run.py
          training/tests/test_file_edit_replacements_diagnostic.py::test_from_file_uses_saved_evidence_and_does_not_write_over_it
          -q
