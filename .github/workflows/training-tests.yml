name: training-tests

on:
  pull_request:
    paths:
      - "training/**"
      - ".gitattributes"
      - ".github/workflows/training-tests.yml"
      - ".github/workflows/training-experiment-tests.yml"
      - ".github/workflows/training-windows-tests.yml"
  push:
    branches:
      - master
    paths:
      - "training/**"
      - ".gitattributes"
      - ".github/workflows/training-tests.yml"
      - ".github/workflows/training-experiment-tests.yml"
      - ".github/workflows/training-windows-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked training environment
        run: uv sync --project training --frozen --group dev
      - name: Run portable required training tests
        run: >
          uv run --project training --no-sync python -m pytest
          training/tests/test_structured_plan_serialization_training.py
          training/tests/test_structured_plan_serialization_curriculum.py
          training/tests/test_structured_plan_semantic_binding_training.py
          training/tests/test_structured_plan_semantic_binding_curriculum.py
          training/tests/test_structured_plan_training.py
          training/tests/test_structured_plan_curriculum.py
          training/tests/test_structured_plan.py
          training/tests/test_structured_plan_binding_diagnostic.py
          training/tests/test_structured_plan_transfer_diagnostic.py
          training/tests/test_request_grounded_coding_curriculum.py
          training/tests/test_request_grounded_coding_bundle.py
          training/tests/test_request_grounded_coding_stage.py
          training/tests/test_request_grounded_coding_training.py
          training/tests/test_request_grounded_coding_run.py
          training/tests/test_structured_plan_evidence_composition_curriculum.py
          training/tests/test_structured_plan_evidence_composition_bundle.py
          training/tests/test_structured_plan_evidence_composition_stage.py
          training/tests/test_structured_plan_evidence_composition_training.py
          training/tests/test_structured_plan_evidence_composition_run.py
          training/tests/test_task_training.py
          training/tests/test_task_finetune.py
          training/tests/test_pilot.py
          training/tests/test_tokenizer.py
          training/tests/test_cli.py
          training/tests/test_data_and_runner.py
          training/tests/test_answer_weighting.py
          training/tests/test_web_contamination.py
          training/tests/test_resume_and_completion.py
          training/tests/test_file_conditioned_contract.py
          training/tests/test_file_edit_replacements.py
          training/tests/test_file_edit_replacements_bundle.py
          training/tests/test_file_edit_replacements_stage.py
          training/tests/test_file_edit_replacements_run.py
          training/tests/test_file_edit_replacements_development.py
          training/tests/test_file_edit_replacements_diagnostic.py
          training/tests/test_p303_diagnostic_decision.py
          training/tests/test_p3_copy_edit_controls.py
          training/tests/test_p3_copy_fidelity_curriculum.py
          training/tests/test_p3_copy_fidelity_bundle_stage.py
          training/tests/test_p3_copy_fidelity_first_run.py
          training/tests/test_p3_copy_fidelity_step100_generation.py
          training/tests/test_p3_source_binding_diagnostic.py
          training/tests/test_p3_source_binding_microprobe.py
          training/tests/test_answer_focused_records.py
          training/tests/test_benchmark.py
          training/tests/test_complete_records.py
          training/tests/test_config.py
          training/tests/test_dataset.py
          training/tests/test_model.py
          training/tests/test_record_sampling.py
          training/tests/test_source_fetch.py
          training/tests/test_tokenizer_review.py
          training/tests/test_web_dataset.py
          training/tests/test_web_materialize.py
          training/tests/test_web_sources.py
          training/tests/test_ci_test_inventory.py
          -q
