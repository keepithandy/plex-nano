name: training-tests

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-tests.yml"
      - ".github/workflows/training-experiment-tests.yml"
  push:
    branches:
      - master
    paths:
      - "training/**"
      - ".github/workflows/training-tests.yml"
      - ".github/workflows/training-experiment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked training environment
        run: uv sync --project training --frozen --group dev
      - name: Run portable required training tests
        run: >
          uv run --project training --no-sync python -m pytest
          training/tests/test_structured_plan_serialization_training.py
          training/tests/test_structured_plan_serialization_curriculum.py
          training/tests/test_structured_plan_semantic_binding_training.py
          training/tests/test_structured_plan_semantic_binding_curriculum.py
          training/tests/test_structured_plan_training.py
          training/tests/test_structured_plan_curriculum.py
          training/tests/test_structured_plan.py
          training/tests/test_structured_plan_binding_diagnostic.py
          training/tests/test_structured_plan_transfer_diagnostic.py
          training/tests/test_request_grounded_coding_curriculum.py
          training/tests/test_request_grounded_coding_bundle.py
          training/tests/test_request_grounded_coding_stage.py
          training/tests/test_request_grounded_coding_training.py
          training/tests/test_request_grounded_coding_run.py
          training/tests/test_structured_plan_evidence_composition_curriculum.py
          training/tests/test_structured_plan_evidence_composition_bundle.py
          training/tests/test_structured_plan_evidence_composition_stage.py
          training/tests/test_structured_plan_evidence_composition_training.py
          training/tests/test_structured_plan_evidence_composition_run.py
          training/tests/test_task_training.py
          training/tests/test_task_finetune.py
          training/tests/test_pilot.py
          training/tests/test_tokenizer.py
          training/tests/test_cli.py
          training/tests/test_data_and_runner.py
          training/tests/test_answer_weighting.py
          training/tests/test_web_contamination.py
          training/tests/test_resume_and_completion.py
          training/tests/test_file_conditioned_contract.py
          training/tests/test_answer_focused_records.py
          training/tests/test_benchmark.py
          training/tests/test_complete_records.py
          training/tests/test_config.py
          training/tests/test_dataset.py
          training/tests/test_model.py
          training/tests/test_record_sampling.py
          training/tests/test_source_fetch.py
          training/tests/test_tokenizer_review.py
          training/tests/test_web_dataset.py
          training/tests/test_web_materialize.py
          training/tests/test_web_sources.py
          training/tests/test_ci_test_inventory.py
          -q

  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked training environment
        run: uv sync --project training --frozen --group dev
      - name: Run Windows portability subset
        run: >
          uv run --project training --no-sync python -m pytest
          training/tests/test_data_and_runner.py::DataAndRunnerTests::test_packed_corpus_yields_next_token_pairs
          training/tests/test_pilot.py::PilotSafetyTests::test_checkpoint_serialization_is_bounded_before_overallocation
          training/tests/test_pilot.py::PilotSafetyTests::test_checkpoint_overwrite_budget_counts_old_checkpoint_during_temp_write
          training/tests/test_pilot.py::PilotSafetyTests::test_failed_final_allocation_check_preserves_checkpoint
          training/tests/test_resume_and_completion.py::ResumeAndCompletionTests::test_windows_destination_spelling_rejects_aliases_and_devices
          training/tests/test_resume_and_completion.py::ResumeAndCompletionTests::test_windows_aliases_rejected_before_device_or_checkpoint_work
          training/tests/test_resume_and_completion.py::ResumeAndCompletionTests::test_resolved_windows_destination_is_validated_too
          training/tests/test_resume_and_completion.py::ResumeAndCompletionTests::test_checkpoint_staging_path_cannot_be_metrics_destination
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_identity_is_deterministic
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_second_publish_failure_rolls_back_existing_pair
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_interruptions_restore_both_outputs
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_rejects_fresh_windows_output_aliases_before_input_read
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_review_rejects_windows_report_spellings_before_input_read
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_generation_checks_resolved_windows_output_spelling
          training/tests/test_file_conditioned_contract.py::FileConditionedContractTests::test_cli_defaults_are_absolute_and_rooted_at_repository
          training/tests/test_cli.py::CliTests::test_artifact_root_helper_does_not_double_existing_prefix
          -q
